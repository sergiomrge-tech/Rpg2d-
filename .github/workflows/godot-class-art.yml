name: Godot Real Class Assets & Summoner Pet Runtime
on:
  push:
    branches: [gpt6-class-art-in-game-20261012]
    paths:
      - 'godot/scripts/game/**'
      - 'godot/scripts/ui/class_select.gd'
      - 'godot/assets/Sprites/Chars/hero_*.png'
      - 'godot/assets/Sprites/Chars/hero_*.json'
      - 'godot/assets/Sprites/Pets/**'
      - 'godot/assets/Sprites/Ui/ClassPortraits/**'
      - 'tools/art_hd/verify_class_art.py'
      - '.github/workflows/godot-class-art.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-class-art-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow for actual atlas QA
        run: python -m pip install 'Pillow>=10,<13'
      - name: Ensure six unique class hero sprites and original animated pet exist
        run: |
          python tools/art_hd/verify_class_art.py
          python tools/test_classes.py
          python tools/test_no_stamina.py
          python tools/test_ui_contract.py
      - name: Install Godot 4.3 and software-driven virtual display
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1 libxcursor1 libxinerama1 libxi6 libxrandr2 unzip
          curl -fsSL -o godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q godot.zip
          sudo mv Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
      - name: Import PNG sprites and parse GDScript
        run: |
          timeout 175 godot --headless --path godot --import > import.log 2>&1
          tail -n 30 import.log
      - name: Real Godot smoke — 6 selectable hero rigs, PET and mobile touch
        run: |
          set -o pipefail
          timeout 150 xvfb-run -a -s '-screen 0 1920x1080x24' godot --path godot --rendering-driver opengl3 -- -uiSmoke -touch 2>&1 | tee runtime.log
          grep -F '[class-smoke] PASS touchscreen select and confirm' runtime.log
          grep -F '[class-smoke] PASS six distinct classes' runtime.log
          grep -F '[ui-smoke] PASS all tests' runtime.log
          ! grep -Eq 'SCRIPT ERROR|Parse Error|\[ui-smoke\].*failed|\[class-smoke\].*failed' runtime.log
      - name: Preserve actual engine logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-six-class-art-and-pet-qa
          path: |
            import.log
            runtime.log
          if-no-files-found: ignore
