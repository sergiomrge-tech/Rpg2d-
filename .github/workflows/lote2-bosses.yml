name: Lote 2 - Five original animated boss sprites
on:
  push:
    branches: [gpt6-lote2-five-bosses-20261012]
    paths:
      - 'tools/art_hd/lote2_bosses.py'
      - 'tools/art_hd/build_lote2_bosses.py'
      - 'tools/art_hd/verify_lote2_bosses.py'
      - '.github/workflows/lote2-bosses.yml'
  workflow_dispatch:
concurrency:
  group: five-insectoid-boss-sprites-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original Python Cairo HD renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libcairo2-dev pkg-config python3-dev
          python -m pip install 'Pillow>=10,<13' numpy scipy pycairo
      - name: Render 5 large boss atlases with 2 unique animation skills
        run: python -u tools/art_hd/build_lote2_bosses.py
      - name: Verify all images, views, transitions and 105 animation tracks
        run: python tools/art_hd/verify_lote2_bosses.py
      - name: Commit actual generated boss sprites and JSON into Unity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for id in mantis_high_reaper scarab_colossus moth_oracle queen_vespara brood_tyrant; do
            git add "unity/Assets/Resources/Sprites/Demons/${id}.png"
            git add "unity/Assets/Resources/Sprites/Demons/${id}.json"
            git add "docs/asset_catalog/previews/lote2/bosses/${id}.png"
          done
          if git diff --cached --quiet; then
            echo 'No art changes'
          else
            git commit -m 'art: 5 bespoke animated high-detail boss creature atlases'
            git fetch origin gpt6-lote2-five-bosses-20261012
            git rebase origin/gpt6-lote2-five-bosses-20261012
            git push origin HEAD:gpt6-lote2-five-bosses-20261012
          fi
