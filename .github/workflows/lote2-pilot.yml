name: Lote 2 - real insectoid sprite atlases
on:
  push:
    branches: [gpt6-lote2-pilot-playable-20261012]
    paths:
      - 'tools/art_hd/lote2_insects.py'
      - 'tools/art_hd/build_lote2_pilot.py'
      - 'tools/art_hd/verify_lote2_pilot.py'
      - '.github/workflows/lote2-pilot.yml'
  workflow_dispatch:
concurrency:
  group: lote2-pilot-art-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install same HD renderer dependencies used by the game
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libcairo2-dev pkg-config python3-dev
          python -m pip install 'Pillow>=10,<13' numpy scipy pycairo
      - name: Generate three distinct, fully animated production atlases
        run: python -u tools/art_hd/build_lote2_pilot.py
      - name: Verify all 18 animation tracks per enemy and actual PNG transparency
        run: python tools/art_hd/verify_lote2_pilot.py
      - name: Commit sprites to feature branch, rebasing concurrent gameplay changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for id in mantis_reaver scarab_brute moth_hexer; do
            git add "unity/Assets/Resources/Sprites/Demons/${id}.png"
            git add "unity/Assets/Resources/Sprites/Demons/${id}.json"
            git add "docs/asset_catalog/previews/lote2/${id}.png"
          done
          if git diff --cached --quiet; then
            echo 'Art already current'
          else
            git commit -m 'art: render mantis, scarab, and moth into game Resources'
            git fetch origin gpt6-lote2-pilot-playable-20261012
            git rebase origin/gpt6-lote2-pilot-playable-20261012
            git push origin HEAD:gpt6-lote2-pilot-playable-20261012
          fi
