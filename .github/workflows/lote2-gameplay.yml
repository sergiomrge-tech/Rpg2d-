name: Lote 2 - Unity gameplay compile and wiring
on:
  push:
    branches: [gpt6-lote2-pilot-playable-20261012]
    paths:
      - 'unity/Assets/Scripts/**'
      - 'unity/Assets/Resources/Maps/village.json'
      - 'tools/art_hd/verify_lote2_gameplay.py'
      - '.github/workflows/lote2-gameplay.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify creature definitions, on-map spawns and distinct ability wiring
        run: python tools/art_hd/verify_lote2_gameplay.py
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile Unity C# source against UnityEngine module reference
        run: bash tools/unity_check.sh
