name: Unity - pedir arquivo de ativação
# Gera o arquivo .alf (ativação manual da licença Personal). Dispara quando docs/request-license.txt muda.
on:
  push:
    branches: [ccr-f2d39ca4-hkguyt]
    paths: ['docs/request-license.txt']
  workflow_dispatch:

jobs:
  request:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gerar arquivo de ativação
        id: alf
        uses: game-ci/unity-request-activation-file@v2
        with:
          unityVersion: 2022.3.45f1
      - name: Publicar o .alf como artefato
        uses: actions/upload-artifact@v4
        with:
          name: Unity_v2022.3.45f1.alf
          path: ${{ steps.alf.outputs.filePath }}
