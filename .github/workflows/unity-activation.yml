name: Unity - pedir arquivo de ativação
# Gera o arquivo .alf (ativação manual da licença Personal) rodando o editor num contêiner GameCI.
# Dispara quando docs/request-license.txt muda.
on:
  push:
    branches: [ccr-f2d39ca4-hkguyt]
    paths: ['docs/request-license.txt']
  workflow_dispatch:

jobs:
  request:
    runs-on: ubuntu-latest
    steps:
      - name: Gerar arquivo de ativação (.alf)
        run: |
          mkdir -p out
          docker run --rm -v "$PWD/out:/out" unityci/editor:ubuntu-2022.3.45f1-base-3 bash -c '
            cd /tmp
            unity-editor -batchmode -nographics -quit -logFile - -createManualActivationFile || true
            ls -la /tmp
            cp /tmp/*.alf /out/ || true
          '
          ls -la out
          test -n "$(ls out/*.alf 2>/dev/null)" || { echo "::error::Nenhum .alf foi gerado"; exit 1; }
      - name: Publicar o .alf como artefato
        uses: actions/upload-artifact@v4
        with:
          name: unity-activation-file
          path: out/*.alf
