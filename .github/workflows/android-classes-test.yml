name: Android APK — 6 Classes + Astral Lynx (Preview)
on:
  push:
    branches: [gpt6-class-art-in-game-20261012]
    paths:
      - '.github/workflows/android-classes-test.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: classes-preview-apk
  cancel-in-progress: true
jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    env:
      GODOT_VERSION: "4.3"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Reuse existing Godot Android export templates
        run: |
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          curl -fsSL -o tpz.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p ~/.local/share/godot/export_templates
          unzip -q tpz.zip -d tpz
          mv tpz/templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
      - name: Android SDK, existing debug signing key and visible launcher icon
        run: |
          cp android/aetheria-teste.keystore "$HOME/debug.keystore"
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.3.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "${HOME}/debug.keystore"
          export/android/debug_keystore_user = "aetheria"
          export/android/debug_keystore_pass = "aetheria123"
          EOF
          sed -i 's/^          //' ~/.config/godot/editor_settings-4.3.tres
          # Preview has a higher versionCode and launcher visibility.
          sed -i 's/version\/code=1/version\/code=2/' godot/export_presets.cfg
          sed -i 's/package\/show_as_launcher_app=false/package\/show_as_launcher_app=true/' godot/export_presets.cfg
      - name: Import actual hero, menu portrait and pet sprites for Android
        run: |
          python3 tools/mobile_project.py godot/project.godot
          set -o pipefail
          godot --headless --path godot --import 2>&1 | tee import.log | tail -35
          ! grep -Eq 'SCRIPT ERROR|Parse Error' import.log
      - name: Export actual signed Android test APK, not a ZIP of source code
        run: |
          mkdir -p dist
          set -o pipefail
          godot --headless --path godot --export-debug "Android" "$PWD/dist/Aetheria_Seis_Classes_Teste.apk" 2>&1 | tee export.log | tail -35
          test -s dist/Aetheria_Seis_Classes_Teste.apk
          unzip -t dist/Aetheria_Seis_Classes_Teste.apk >/dev/null
          ls -lh dist/Aetheria_Seis_Classes_Teste.apk
      - name: Upload installable APK to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: Aetheria-6-Classes-APK-TESTE
          path: dist/Aetheria_Seis_Classes_Teste.apk
          if-no-files-found: error
      - name: Publish separately from the normal apk-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete aetheria-6-classes-preview --yes --cleanup-tag || true
          gh release create aetheria-6-classes-preview dist/Aetheria_Seis_Classes_Teste.apk --target "$GITHUB_SHA" --title "Aetheria — seis classes e Lince Astral (APK TESTE)" --notes "APK Android EXPERIMENTAL do PR #14, commit ${{ github.sha }}. Escolha seis classes, teste arco, adagas, magias, Paladino e Invocador com pet original. Preserva chave debug antiga. Ainda requer avaliação visual no aparelho. Não é publicação da versão principal." --prerelease
      - name: Keep APK export logs for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Aetheria-classes-export-logs
          path: |
            import.log
            export.log
          if-no-files-found: ignore
