name: android-apk
on:
  workflow_dispatch:
  push:
    branches: ['ccr-*']
permissions:
  contents: write
jobs:
  apk:
    # on pushes, only commits whose message contains [apk] build the APK
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[apk]')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GODOT_VERSION: "4.3"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Godot + export templates
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && sudo mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          curl -sSL -o tpz.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p ~/.local/share/godot/export_templates
          unzip -q tpz.zip -d tpz && mv tpz/templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
      - name: Configure Android export (SDK, JDK, debug keystore)
        run: |
          cp android/aetheria-teste.keystore $HOME/debug.keystore   # same signing key on every build
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.3.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "${HOME}/debug.keystore"
          export/android/debug_keystore_user = "aetheria"
          export/android/debug_keystore_pass = "aetheria123"
          EOF
          sed -i 's/^          //' ~/.config/godot/editor_settings-4.3.tres
          ls $ANDROID_HOME $ANDROID_HOME/build-tools || true
      - name: Mobile project settings + import
        run: |
          python3 tools/mobile_project.py godot/project.godot
          godot --headless --path godot --import 2>&1 | tail -5 || true
      - name: Export APK
        run: |
          mkdir -p dist
          godot --headless --path godot --export-debug "Android" "$PWD/dist/Aetheria.apk" 2>&1 | tail -30
          ls -la dist
      - name: Zip APK + instructions
        run: |
          cp android/LEIA-ME.txt dist/
          cd dist && zip -q Aetheria-android.zip Aetheria.apk LEIA-ME.txt && ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: Aetheria-apk
          path: dist/Aetheria.apk
      - name: Publish release (easy download from the phone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest dist/Aetheria-android.zip dist/Aetheria.apk --title "Aetheria APK (teste)" --notes "Build do commit ${{ github.sha }}. Instale no Android (permitir fontes desconhecidas)." --prerelease
